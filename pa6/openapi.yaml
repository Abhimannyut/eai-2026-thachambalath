openapi: 3.0.3
info:
  title: PA6 Checkout Saga Orchestrator Contract
  version: 1.0.0
  description: >-
    Contract for the PA6 checkout saga orchestrator. Drives payment authorization,
    inventory reservation, shipping creation, and customer notification sequentially
    for an incoming canonical order. Steps execute strictly one after another.
    Upon downstream error or timeout, completed steps with compensation capability
    (inventory and payment) roll back in reverse order. Replays and in-flight conflicts
    are managed idempotently using the Idempotency-Key header.
  contact:
    name: Course Support
    email: support@example.com
servers:
  - url: http://localhost:3000
    description: Local orchestrator instance.
tags:
  - name: system
    description: System health and readiness probes.
  - name: checkout
    description: Order checkout saga orchestration endpoints.
paths:
  /health:
    get:
      operationId: getHealth
      tags:
        - system
      summary: Liveness health check
      description: Returns HTTP 200 with status ok when the orchestrator process is up.
      responses:
        "200":
          description: The orchestrator process is healthy and ready to process sagas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /checkout:
    post:
      operationId: createCheckout
      tags:
        - checkout
      summary: Run checkout saga for one canonical order
      description: >-
        Orchestrates checkout across four downstream services (payment, inventory, shipping, notification)
        in strict sequence. Computes total charge amount in cents as a decimal string and dispatches notification
        to customer email. Triggers reverse compensation for inventory and payment on failure.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: >-
            Unique idempotency token supplied by the caller. Enforces safe replays and prevents duplicate charges.
            Replays of identical payload return the cached response. Conflicting payloads or concurrent runs yield HTTP 409.
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        description: >-
          The canonical order payload complying with canonical/order.schema.json, with bounded line items.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CanonicalOrder"
      responses:
        "200":
          description: >-
            All four forward steps succeeded without errors. Saga state is completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
        "400":
          description: >-
            Validation error: missing Idempotency-Key header, invalid canonical order schema, or unbounded item count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >-
            Idempotency conflict: key matches an in-flight saga (idempotency_conflict) or an existing key was reused with a different request payload (idempotency_payload_mismatch).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >-
            A downstream service rejected the transaction. Compensation executed in reverse order.
            Returns status compensated on successful rollback, or failed with code compensation_failed if rollback failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
        "504":
          description: >-
            A downstream step exceeded the timeout deadline. Code is timeout and compensation has executed for earlier steps.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
components:
  schemas:
    HealthStatus:
      type: object
      description: Health check response body.
      required:
        - status
      properties:
        status:
          type: string
          description: Liveness state indicator, always ok.
          enum:
            - ok
    Address:
      type: object
      description: Customer delivery postal address.
      additionalProperties: false
      required:
        - street
        - city
        - postalCode
        - country
      properties:
        street:
          type: string
          description: Street name and building number.
          minLength: 1
        city:
          type: string
          description: City or municipality name.
          minLength: 1
        postalCode:
          type: string
          description: National postal code format.
          minLength: 1
        country:
          type: string
          description: Two-letter ISO 3166-1 alpha-2 country code.
          minLength: 2
          maxLength: 2
    Customer:
      type: object
      description: Customer profile associated with the order.
      additionalProperties: false
      required:
        - name
        - email
        - address
      properties:
        name:
          type: string
          description: Customer full legal or display name.
          minLength: 1
        email:
          type: string
          description: Customer contact email receiving notifications.
          format: email
        address:
          $ref: "#/components/schemas/Address"
    OrderItem:
      type: object
      description: Single line item belonging to the canonical order.
      additionalProperties: false
      required:
        - productId
        - productName
        - quantity
        - unitPrice
        - currency
        - taxRate
      properties:
        productId:
          type: string
          description: Pricing-compliant product SKU.
          pattern: "^PROD-[0-9]+$"
        productName:
          type: string
          description: Descriptive name of product.
          minLength: 1
        quantity:
          type: integer
          description: Quantity of product units purchased.
          minimum: 1
        unitPrice:
          type: string
          description: Two-decimal string price unit, e.g. 19.99.
          pattern: "^-?[0-9]+\\.[0-9]{2}$"
        currency:
          type: string
          description: Three-letter ISO currency code.
          minLength: 3
        taxRate:
          type: number
          description: Fractional tax rate between 0 and 1.
          minimum: 0
          maximum: 1
    CanonicalOrder:
      type: object
      description: >-
        Inbound canonical order conforming to canonical/order.schema.json with explicit item array bounds.
      additionalProperties: false
      required:
        - orderId
        - orderType
        - source
        - receivedAt
        - orderDate
        - customer
        - items
        - currency
        - status
      properties:
        orderId:
          type: string
          description: Globally unique identifier for this order.
          minLength: 1
        orderType:
          type: string
          description: Classification of order processing speed and tier.
          enum:
            - standard
            - express
            - b2b
        source:
          type: string
          description: Upstream originator platform channel.
          enum:
            - web
            - mobile
            - b2b
        receivedAt:
          type: string
          description: Ingestion timestamp recorded by canonical translator.
          format: date-time
        orderDate:
          type: string
          description: Original order placement timestamp in UTC.
          format: date-time
        customer:
          $ref: "#/components/schemas/Customer"
        items:
          type: array
          description: Enforced bound of line items per checkout transaction.
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/OrderItem"
        currency:
          type: string
          description: Currency applied to the entire order.
          minLength: 3
        status:
          type: string
          description: Lifecycle state of the order upon submission.
          enum:
            - new
            - processing
            - shipped
            - delivered
    TraceItem:
      type: object
      description: Recorded execution timing and status of an individual saga forward or compensation step.
      required:
        - step
        - status
        - startedAt
        - finishedAt
        - durationMs
      properties:
        step:
          type: string
          description: Identifying label for the saga step.
          minLength: 1
        status:
          type: string
          description: Completion outcome of the step.
          enum:
            - success
            - failed
            - timeout
        startedAt:
          type: string
          description: ISO-8601 start timestamp.
          format: date-time
        finishedAt:
          type: string
          description: ISO-8601 finish timestamp.
          format: date-time
        durationMs:
          type: integer
          description: Wall-clock step execution time in milliseconds.
          minimum: 0
    CheckoutResponse:
      type: object
      description: Terminal payload returned by POST /checkout.
      required:
        - orderId
        - status
        - trace
      properties:
        orderId:
          type: string
          description: The order identifier passed in the request.
          minLength: 1
        status:
          type: string
          description: Terminal saga outcome status.
          enum:
            - completed
            - failed
            - compensated
            - in_progress
        code:
          type: string
          description: Machine-readable reason code for errors and compensations.
          minLength: 1
        trace:
          type: array
          description: Ordered sequence of all forward and compensation steps executed.
          maxItems: 16
          items:
            $ref: "#/components/schemas/TraceItem"
    ErrorResponse:
      type: object
      description: Structured error body for HTTP 400 and 409 responses.
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Machine-readable error code.
          enum:
            - validation_error
            - idempotency_conflict
            - idempotency_payload_mismatch
        message:
          type: string
          description: Informative explanation of validation or conflict failure.
          minLength: 1
